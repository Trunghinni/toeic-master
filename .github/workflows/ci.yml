name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Use a dummy DATABASE_URL for build-time — no real DB needed for lint/build
  DATABASE_URL: "postgresql://toeic:toeic_secret@localhost:5432/toeic_master"
  REDIS_URL: "redis://localhost:6379"
  JWT_ACCESS_SECRET: "ci_access_secret_placeholder_min_32chars"
  JWT_REFRESH_SECRET: "ci_refresh_secret_placeholder_min_32chars"
  NODE_ENV: "test"

jobs:
  # ── Lint ──────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm lint

  # ── Build ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build all apps
        run: pnpm turbo run build --verbosity=2

  # ── Unit Tests ────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toeic
          POSTGRES_PASSWORD: toeic_secret
          POSTGRES_DB: toeic_master
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run migrations
        run: pnpm --filter api exec -- npx prisma migrate deploy --schema=../../prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://toeic:toeic_secret@localhost:5432/toeic_master

      - name: Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://toeic:toeic_secret@localhost:5432/toeic_master
